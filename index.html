<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Searchable glossary for the Marvel Champions Rules Reference v1.8." />
  <meta name="theme-color" content="#0f1420" />
  <title>Champions Rules — Reference Glossary</title>

  <!-- Favicons -->
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />

  <!-- iOS home-screen icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Champions Rules" />

  <!-- PWA manifest -->
  <link rel="manifest" href="assets/manifest.json" />

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== App header ===== -->
  <header class="app-header">
    <h1 class="app-title">Champions <span>Rules</span></h1>
  </header>

  <!-- ===== Main layout ===== -->
  <div class="layout">

    <!-- Sidebar: search + term index -->
    <aside class="sidebar" aria-label="Glossary navigation">
      <label for="search" class="visually-hidden">Search terms</label>
      <input
        id="search"
        type="search"
        placeholder="Search terms…"
        autocomplete="off"
        spellcheck="false"
        aria-controls="termList"
      />
      <nav id="termList" aria-label="Glossary terms">
        <!-- Term links injected by app.js -->
      </nav>
    </aside>

    <!-- Main entry content -->
    <main id="entry" class="content" aria-live="polite">
      <!-- Selected entry injected by app.js -->
    </main>

  </div>

  <!-- ===== App logic ===== -->
  <script src="app.js" defer></script>

  <!-- Minimal visually-hidden helper (kept inline so it can't be missed) -->
  <style>
    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0);
      white-space: nowrap; border: 0;
    }
  </style>

</body>
</html>
